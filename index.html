  </aside>
</div>

const fullView={x:0,y:-20,w:900,h:920};function setViewBox(v){svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`)}
function baseTerrain(){return `<rect class="sea" x="-40" y="-60" width="1000" height="1020"/><image href="https://upload.wikimedia.org/wikipedia/commons/3/31/Provinces_of_Japan.svg" x="70" y="40" width="760" height="794" preserveAspectRatio="none"/><rect x="70" y="40" width="760" height="794" fill="none" stroke="#d7e8e5" stroke-width="3"/><g transform="translate(35 30)"><circle class="mapCompass" cx="0" cy="0" r="30"/><path d="M0-24L6 0 0 24-6 0z" fill="#244e72"/><path d="M-24 0L0 6 24 0 0-6z" fill="#fff"/><text x="0" y="-35" text-anchor="middle" class="mapHudText">N</text></g><g transform="translate(55 825)"><rect class="mapHud" width="300" height="68" rx="8"/><text class="mapHudText" x="12" y="22">🟦 自勢力　🟥 敵対　🟨 中立</text><text class="mapHudText" x="12" y="47">🏯 城　⚑ 部隊　┄ 街道　≈ 河川　｜ 基図: 旧国境</text></g><g transform="translate(720 850)"><path class="scaleLine" d="M0 0H140 M0-6V6 M70-6V6 M140-6V6"/><text class="scaleText" x="0" y="22">0</text><text class="scaleText" x="64" y="22">100</text><text class="scaleText" x="132" y="22">200 km</text></g>`}
function addText(x,y,text,cls='provinceLabel'){const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class',cls);t.textContent=text;svg.appendChild(t)}
function poly(p,cls='province'){const el=document.createElementNS(NS,'polygon');el.setAttribute('points',p.points.map(q=>`${q.x},${q.y}`).join(' '));el.setAttribute('class',cls);el.setAttribute('fill',p.color);el.dataset.province=p.id;el.addEventListener('click',e=>{e.stopPropagation();selectProvince(p.id)});svg.appendChild(el);addText(p.x,p.y+4,p.name,'provinceLabel')}
function drawNational(){state.view={level:'national',region:null,province:null};setViewBox(fullView);svg.innerHTML=baseTerrain();state.regions.forEach(reg=>{const ps=state.provinces.filter(p=>p.region===reg.id);if(!ps.length)return;const b=bounds(ps,18);const z=document.createElementNS(NS,'rect');z.setAttribute('x',b.x);z.setAttribute('y',b.y);z.setAttribute('width',b.w);z.setAttribute('height',b.h);z.setAttribute('rx',28);z.setAttribute('class','regionZone');z.addEventListener('click',()=>openRegion(reg.id));svg.appendChild(z);addText(b.x+b.w/2,b.y+18,reg.name,'regionLabel')});state.provinces.forEach(p=>poly(p));renderArmies();updateMapBar('全国地図','国をクリックすると国へ。地方のラベル・枠から地方拡大もできます');renderBreadcrumb()}
function openRegion(id){const reg=state.regions.find(r=>r.id===id);state.view={level:'region',region:id,province:null};const ps=state.provinces.filter(p=>p.region===id);const box=bounds(ps,25);setViewBox(box);svg.innerHTML=baseTerrain();ps.forEach(p=>poly(p));renderArmies();updateMapBar(`${reg.name}地方`,`国をクリックすると、その国をさらに拡大`);renderBreadcrumb()}
function bounds(ps,pad){const pts=ps.flatMap(p=>p.points);return {x:Math.max(-20,Math.min(...pts.map(p=>p.x))-pad),y:Math.min(-40,Math.min(...pts.map(p=>p.y))-pad),w:Math.max(120,Math.max(...pts.map(p=>p.x))-Math.min(...pts.map(p=>p.x))+pad*2),h:Math.max(120,Math.max(...pts.map(p=>p.y))-Math.min(...pts.map(p=>p.y))+pad*2)}}
function selectProvince(id){if(state.pendingArmy){issueOrder(id);return}const p=state.provinces.find(x=>x.id===id);state.selected=p;if(state.view.level==='national')state.view={level:'province',region:p.region,province:id};showProvinceInfo(p);renderBreadcrumb();openProvinceMap(id)}
function openProvinceMap(id){const p=state.provinces.find(x=>x.id===id);state.view={level:'province',region:p.region,province:id};setViewBox(bounds([p],55));svg.innerHTML=baseTerrain();poly(p);p.castles.forEach((c,i)=>{const ang=i/p.castles.length*Math.PI*2;const x=p.x+Math.cos(ang)*25,y=p.y+Math.sin(ang)*18;const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class','castleMark');t.textContent='🏯';t.addEventListener('click',()=>showCastle(c,p.name));svg.appendChild(t);addText(x,y+17,c,'castleLabel')});state.armies.filter(a=>a.province===id).forEach(a=>drawArmyOnSvg(a));updateMapBar(`${p.name}国 詳細地図`,'山脈・河川・街道は地形把握用の概略表示。城をクリックできます');renderBreadcrumb()}
function drawArmyOnSvg(a){const p=state.provinces.find(x=>x.id===a.province);if(!p)return;const size=Math.max(14,Math.min(28,14+a.troops/3000));const g=document.createElementNS(NS,'g');g.setAttribute('class','armySvg');g.setAttribute('transform',`translate(${p.x} ${p.y})`);g.addEventListener('click',()=>showArmy(a));g.innerHTML=`<path d="M0 -${size} L${size} ${-size/3} L${size} ${size} L-${size} ${size} L-${size} -${size/3}Z" fill="${a.lord==='青葉家'?'#315f88':'#7d403f'}" stroke="#fff" stroke-width="2"/><text x="0" y="4" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">◇</text>`;svg.appendChild(g)}
function renderArmies(){document.getElementById('armyLayer').innerHTML='';if(state.view.level==='province')return;state.armies.forEach(a=>{const p=state.provinces.find(x=>x.id===a.province);if(!p)return;const el=document.createElement('div');el.className='army';el.style.left=(p.x/900*100)+'%';el.style.top=((p.y+20)/920*100)+'%';const size=Math.max(58,Math.min(110,58+a.troops/30000*52));el.innerHTML=`<div class="piece" style="width:${size}px;height:${size}px;background:${a.lord==='青葉家'?'#315f88':'#7d403f'}"><span>◇</span><small>${a.family}</small><div>${a.troops.toLocaleString()}兵</div></div>`;el.addEventListener('click',()=>showArmy(a));document.getElementById('armyLayer').appendChild(el)})}
function updateMapBar(title,sub){document.querySelector('.mapbar h1').textContent=title;document.querySelector('.mapbar span').textContent=sub}
function renderBreadcrumb(){const el=document.getElementById('breadcrumb');const parts=['全国'];if(state.view.region)parts.push(state.regions.find(r=>r.id===state.view.region)?.name);if(state.view.province)parts.push(state.provinces.find(p=>p.id===state.view.province)?.name+'国');el.innerHTML=parts.map((x,i)=>`<button onclick="breadcrumbGo(${i})">${x}</button>`).join('<span>›</span>')}
function breadcrumbGo(i){if(i===0)drawNational();else if(i===1)openRegion(state.view.region);else if(i===2)openProvinceMap(state.view.province)}
function showProvinceInfo(p){document.getElementById('countryInfo').innerHTML=`<h2>${p.name}国</h2><div class="tag ${p.relation==='敵対'?'enemy':''}">${p.relation}</div><div class="card"><b>支配勢力</b><br>${p.lord}</div><div class="grid"><div class="stat">石高<b>${p.koku}万石</b></div><div class="stat">人口<b>${p.pop.toLocaleString()}</b></div><div class="stat">💰金収入<b>${p.gold.toLocaleString()}</b></div><div class="stat">🌾兵糧<b>${p.food.toLocaleString()}</b></div></div><div class="card"><b>地形</b><br>${p.terrain}</div><div class="card"><b>城</b>${p.castles.map(c=>`<button class="castleBtn" onclick="showCastle('${c}','${p.name}')">🏯 ${c}</button>`).join('')}</div><button class="detailBtn" onclick="openProvinceMap('${p.id}')">🗺 ${p.name}国をさらに拡大</button>${state.armies.filter(a=>a.province===p.id).length?`<div class="card"><b>⚑ 部隊情報</b>${state.armies.filter(a=>a.province===p.id).map(a=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ddd4c8"><span>${a.family} ${a.name}</span><b>${a.troops.toLocaleString()}兵</b></div>`).join('')}</div>`:''}`}
function showCastle(name,country){const p=state.provinces.find(x=>x.name===country);document.getElementById('modalContent').innerHTML=`<h2>🏯 ${name}</h2><p>${country}国・${p.lord}</p><div class="grid"><div class="stat">城兵<b>${Math.round(p.koku*100)}人</b></div><div class="stat">防御力<b>${55+p.koku}</b></div><div class="stat">兵糧<b>${Math.round(p.food*.25).toLocaleString()}</b></div><div class="stat">城郭<b>${p.koku>55?'大':'中'}</b></div></div><div class="card"><b>城下・街道</b><br>街道・河川・周辺地形を基に、今後補給線や移動時間を設定できます。</div>`;openModal()}
function showArmy(a){const here=state.provinces.find(p=>p.id===a.province);const enemies=state.armies.filter(x=>x.id!==a.id&&x.lord!==a.lord&&x.province===a.province);document.getElementById('modalContent').innerHTML=`<h2>⚔️ ${a.name}</h2><p>所属：${a.lord}</p><div class="grid"><div class="stat">兵力<b>${a.troops.toLocaleString()}兵</b></div><div class="stat">状態<b>${a.status}</b></div></div><div class="card"><b>現在地</b><br>${here?.name||'不明'}国</div><div class="card"><b>目的地</b><br>${a.target||'なし'}</div>${enemies.length?`<div class="card enemy"><b>⚠️ 同一国に敵軍</b><br>${enemies.map(e=>`${e.name} ${e.troops.toLocaleString()}兵`).join('<br>')}</div>`:''}<button onclick="startArmyOrder('${a.id}','move')">🚶 移動命令</button><button onclick="startArmyOrder('${a.id}','attack')">⚔️ 攻撃命令</button><button onclick="startArmyOrder('${a.id}','defend')">🛡 防御</button><button onclick="splitArmy('${a.id}')">↔️ 分割</button>`;openModal()}
function startArmyOrder(id,type){state.pendingArmy={id,type};document.getElementById('modal').classList.add('hidden');updateMapBar(type==='move'?'移動先を選択':'攻撃対象を選択','地図上の国をクリックして命令を確定。Escでキャンセル');document.body.classList.add('ordering')}
function cancelOrder(){state.pendingArmy=null;document.body.classList.remove('ordering');redrawView()}
function provinceDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function neighbors(id){const p=state.provinces.find(x=>x.id===id);if(!p)return[];return state.provinces.filter(q=>q.id!==id&&q.region===p.region&&provinceDistance(p,q)<115).sort((a,b)=>provinceDistance(p,a)-provinceDistance(p,b)).slice(0,4)}
function routeBetween(from,to){if(from===to)return[from];const q=[[from]],seen=new Set([from]);while(q.length){const path=q.shift(),last=path[path.length-1];for(const n of neighbors(last)){if(seen.has(n.id))continue;const np=[...path,n.id];if(n.id===to)return np;seen.add(n.id);q.push(np)}}return[from,to]}
function issueOrder(destId){if(!state.pendingArmy)return;const {id,type}=state.pendingArmy,a=state.armies.find(x=>x.id===id),dest=state.provinces.find(p=>p.id===destId);if(!a||!dest){cancelOrder();return}if(type==='defend'){a.status='防御';a.target='';cancelOrder();return}if(type==='move'&&dest.id===a.province){a.status='待機';a.target='';cancelOrder();return}const route=routeBetween(a.province,dest.id),turns=Math.max(1,route.length-1);state.movements=state.movements.filter(m=>m.armyId!==a.id);state.movements.push({armyId:a.id,type,route,index:0,remaining:turns});a.status=type==='attack'?'攻撃進軍':'進軍中';a.target=dest.name+'国';a.route=route;cancelOrder();renderPanels()}
function splitArmy(id){const a=state.armies.find(x=>x.id===id);if(!a||a.troops<1000)return alert('分割できる兵力がありません。');const n=Math.floor(a.troops/2);a.troops-=n;state.armies.push({id:'a'+Date.now(),lord:a.lord,name:a.name+' 分隊',troops:n,province:a.province,target:'',status:'待機',family:a.family});document.getElementById('modal').classList.add('hidden');renderPanels();redrawView()}
function redrawView(){if(state.view.level==='national')drawNational();else if(state.view.level==='region')openRegion(state.view.region);else openProvinceMap(state.view.province)}
function advanceArmies(){const completed=[];for(const m of state.movements){const a=state.armies.find(x=>x.id===m.armyId);if(!a)continue;if(m.index<m.route.length-1){m.index++;a.province=m.route[m.index];m.remaining--;a.target=m.remaining?state.provinces.find(p=>p.id===m.route[m.route.length-1])?.name+'国':'';a.status=m.remaining?(m.type==='attack'?'攻撃進軍':'進軍中'):'到着';if(!m.remaining)completed.push(m)}}for(const m of completed){const a=state.armies.find(x=>x.id===m.armyId);state.movements=state.movements.filter(x=>x!==m);resolveContact(a)}for(const a of state.armies)if(a.status==='到着')a.status='待機'}
function resolveContact(a){if(!a)return;const enemies=state.armies.filter(x=>x.id!==a.id&&x.lord!==a.lord&&x.province===a.province&&x.troops>0);if(!enemies.length)return;const enemy=enemies[0];if(a.troops>=enemy.troops*1.25){a.troops=Math.max(0,Math.round(a.troops-enemy.troops*.25));enemy.troops=0;enemy.status='壊滅';alert(`${a.name}が${enemy.name}を撃破しました。`)}else if(enemy.troops>=a.troops*1.25){enemy.troops=Math.max(0,Math.round(enemy.troops-a.troops*.25));a.troops=0;a.status='壊滅';alert(`${a.name}は敵軍に敗北しました。`)}else{a.troops=Math.round(a.troops*.65);enemy.troops=Math.round(enemy.troops*.65);a.status='交戦';enemy.status='交戦';alert(`${a.name}と${enemy.name}が交戦しました。両軍が損耗しています。`)}}

function fieldBattle(attacker,defender){
  if(!attacker||!defender||attacker.troops<=0||defender.troops<=0)return;
  const aPower=attacker.troops*(0.85+Math.random()*0.3),dPower=defender.troops*(0.85+Math.random()*0.3);
  const aLoss=Math.max(1,Math.round(defender.troops*(aPower>=dPower?0.22:0.38)));
  const dLoss=Math.max(1,Math.round(attacker.troops*(aPower>=dPower?0.34:0.20)));
  attacker.troops=Math.max(0,attacker.troops-aLoss); defender.troops=Math.max(0,defender.troops-dLoss);
  if(attacker.troops>defender.troops*1.18){defender.status='敗走';attacker.status='野戦勝利';logBattle(`${attacker.name}が${defender.name}との野戦に勝利。敵軍は敗走。`);}
  else if(defender.troops>attacker.troops*1.18){attacker.status='敗走';defender.status='野戦勝利';logBattle(`${attacker.name}が${defender.name}に敗北。`);}

function resolveArrivalV6(a){

renderPanels=function(){v7Render();const box=document.getElementById('militaryContent');if(!box)return;const rows=state.sieges.map(s=>`<tr><td>${state.armies.find(a=>a.id===s.armyId)?.name||'—'}</td><td>${s.castle}</td><td>${s.mode}</td><td>${Math.round(s.progress)}%</td><td>${Math.round(s.garrison).toLocaleString()}</td></tr>`).join('');if(rows)box.insertAdjacentHTML('beforeend',`<h3>🏯 包囲戦</h3><table><tr><th>攻撃軍</th><th>城</th><th>方式</th><th>進捗</th><th>守備兵</th></tr>${rows}</table>`);const logs=state.battleLog.slice(0,5).map(x=>`<div class="card">${x}</div>`).join('');if(logs)box.insertAdjacentHTML('beforeend',`<h3>📜 最新戦況</h3>${logs}`);};

/* v9 bridge: expose v7 route/movement helpers without changing v7 behavior. */
window.roadLinks = roadLinks;
window.findRoute = typeof findRoute === 'function' ? findRoute : undefined;
window.v7AdvanceMovements = v7AdvanceMovements;

</script>
<script>
/* =========================================================
   戦国シミュレーション v9 本格シミュレーション拡張
   v7/v8の既存データ構造を壊さず、経済・AI・戦闘・城郭・補給・外交・諜報・保存を統合。
   ========================================================= */
(() => {
  'use strict';
  const S = window.state;
  if (!S) return;
  S.version = 'v9';
  S.date = S.date || {year:1560, season:0};
  S.ai = S.ai || {};
  S.economy = S.economy || {};
  S.log = S.log || [];
  S.intelligence = S.intelligence || {};
  S.diplomacy = S.diplomacy || {};
  S.supply = S.supply || {};
  S.castleState = S.castleState || {};
  S.weather = S.weather || '晴';

  const SEASONS=['春','夏','秋','冬'];
  const TERRAIN={
    '山地':{move:1.45,def:1.18,attack:.86},'平野':{move:.9,def:1,attack:1.05},
    '丘陵':{move:1.12,def:1.08,attack:.94},'河川':{move:1.25,def:1.15,attack:.78},
    '海岸':{move:.95,def:.98,attack:1},'湿地':{move:1.35,def:1.12,attack:.82}
  };
  const PERSONALITIES=['拡張型','防衛型','内政型','外交型','好戦型','慎重型'];

  // ---------- 基礎データ ----------
  S.provinces.forEach(p=>{
    p.terrainType = p.terrainType || inferTerrain(p.name);
    p.infrastructure = p.infrastructure ?? 40;
    p.floodControl = p.floodControl ?? 35;
    p.commerce = p.commerce ?? 30;
    p.development = p.development ?? Math.min(90, Math.round(p.koku*.75));
    p.loyalty = p.loyalty ?? 70;
    p.unrest = p.unrest ?? 0;
    p.population = p.pop ?? p.population ?? p.koku*3500;
    p.foodStock = p.food ?? p.foodStock ?? p.koku*550;
    p.goldStock = p.gold ?? p.goldStock ?? p.koku*170;
    p.mobilization = p.mobilization ?? .11;
    p.taxRate = p.taxRate ?? .28;
    p.garrison = p.garrison ?? Math.round(p.koku*90);
  });
  S.armies.forEach(a=>initArmy(a));
  S.retainers.forEach((r,i)=>{
    const [name,role,lead,war,dom,fin,dip]=r;
    S.ai.officers = S.ai.officers || {};
    S.ai.officers[name] = S.ai.officers[name] || {name,role,leadership:lead,martial:war,domestic:dom,finance:fin,diplomacy:dip,loyalty:70,exp:50};
  });
  ['黒峰家','白峰家','霞家','織部家','湖東家','赤城家','駿河井家','南海家','播磨井家','国人衆'].forEach((lord,i)=>{
    if(lord==='青葉家') return;
    S.ai[lord] = S.ai[lord] || {personality:PERSONALITIES[i%PERSONALITIES.length],aggression:45+(i%4)*12,risk:35+(i%5)*8,priority:'balanced',lastAction:'待機'};
  });
  S.ai['青葉家'] = S.ai['青葉家'] || {personality:'拡張型',aggression:50,risk:40,priority:'balanced',lastAction:'プレイヤー'};

  function inferTerrain(name){
    if(/越後|信濃|飛騨|甲斐|上野|紀伊|伊賀|丹波|但馬|美作|出雲|石見|肥後|薩摩/.test(name)) return '山地';
    if(/河内|摂津|播磨|備前|備中|備後|安芸|武蔵|相模|下総|上総|尾張|美濃|三河|駿河|遠江|筑前|筑後/.test(name)) return '平野';
    if(/越中|加賀|越前|近江|大和|伊勢|下野|常陸|陸奥|出羽|陸前|陸中|岩代|磐城/.test(name)) return '丘陵';
    return '海岸';
  }
  function initArmy(a){
    a.morale = a.morale ?? 78; a.fatigue=a.fatigue??0; a.supply=a.supply??100; a.training=a.training??55;
    a.commander=a.commander||S.retainers[Math.floor(Math.random()*Math.max(1,S.retainers.length))]?.[0]||'無名武将';
    a.unitType=a.unitType||'混成軍'; a.home=a.home||a.province; a.food=a.food??Math.max(100,a.troops*.8);
    a.actionPoints=a.actionPoints??2;
  }

  // ---------- ログ ----------
  function v9log(text,type='system'){
    const msg=`第${S.turn}ターン・${SEASONS[S.date.season]}：${text}`;
    S.log.unshift({turn:S.turn,text:msg,type}); S.log=S.log.slice(0,80);
    if(window.logBattle) window.logBattle(text);
  }

  // ---------- 季節・経済 ----------
  function advanceCalendar(){
    S.date.season=(S.date.season+1)%4;
    if(S.date.season===0) S.date.year++;
  }
  function updateEconomy(){
    let income=0,foodGain=0,pop=0;
    S.provinces.forEach(p=>{
      const growth = .006 + p.infrastructure*.00003 - p.unrest*.00008;
      p.population=Math.max(500,Math.round(p.population*(1+growth)));
      p.pop=p.population;
      const harvest = S.date.season===2 ? 1.22 : (S.date.season===1 ? 1.08 : .78);
      const food=Math.max(0,Math.round(p.koku*550*(.72+p.development/250)*harvest*(1-p.unrest/140)));
      const tax=Math.max(0,Math.round(p.koku*170*(.65+p.commerce/180)*p.taxRate));
      p.foodStock=Math.max(0,p.foodStock+food);
      p.goldStock=Math.max(0,p.goldStock+tax);
      if(p.lord==='青葉家'){income+=tax;foodGain+=food;pop+=p.population;}
      p.unrest=Math.max(0,p.unrest-(p.loyalty>60?2:1));
      p.loyalty=Math.max(0,Math.min(100,p.loyalty-(p.taxRate>.35?1:0)+ (p.unrest<10?1:0)));
    });
    S.gold += income; S.food += foodGain;
    S.population=pop || S.population;
    S.troops=S.armies.filter(a=>a.lord==='青葉家').reduce((n,a)=>n+a.troops,0);
  }
  function maintainArmies(){
    S.armies.forEach(a=>{
      initArmy(a);
      const consumption=Math.max(10,Math.round(a.troops*.12));
      const p=S.provinces.find(x=>x.id===a.province);
      const local=p?.lord===a.lord;
      if(local){a.supply=Math.min(100,a.supply+14);a.food+=consumption*.5;}
      else {a.food-=consumption;a.supply-=a.food<0?12:4;a.morale-=a.food<0?5:1;}
      a.fatigue=Math.min(100,a.fatigue+(a.status==='待機'?-6:5));
      a.supply=Math.max(0,a.supply);a.morale=Math.max(0,Math.min(100,a.morale));a.fatigue=Math.max(0,a.fatigue);
      if(a.supply<25){a.morale-=3;a.status=a.status==='待機'?'補給不足':a.status;}
      if(a.troops<=0)a.status='壊滅';
    });
  }

  // ---------- 戦闘 ----------
  function officer(a){return S.ai.officers?.[a.commander] || {leadership:55,martial:55,domestic:50,diplomacy:50};}
  function combatPower(a,p,defending=false){
    const o=officer(a), t=TERRAIN[p?.terrainType||'平野'];
    const terrain=defending?t.def:t.attack;
    const weather=S.weather==='雨'?.92:S.weather==='雪'?.86:1;
    const morale=.65+a.morale/180, supply=.55+a.supply/220, fatigue=1-a.fatigue*.003;
    return Math.max(1,a.troops*(.72+o.leadership/300+o.martial/400)*(a.training/100+.55)*morale*supply*fatigue*terrain*weather);
  }
  function detailedBattle(att,def,p){
    if(!att||!def||att.troops<=0||def.troops<=0)return;
    const ap=combatPower(att,p,false), dp=combatPower(def,p,true);
    const ratio=ap/(ap+dp);
    const variance=.88+Math.random()*.24;
    const aLoss=Math.max(1,Math.round(def.troops*(.07+.24*(1-ratio))*variance));
    const dLoss=Math.max(1,Math.round(att.troops*(.07+.24*ratio)*variance));
    att.troops=Math.max(0,att.troops-aLoss); def.troops=Math.max(0,def.troops-dLoss);
    att.morale+=ratio>.55?3:-5; def.morale+=ratio<.45?3:-5;
    att.fatigue+=8;def.fatigue+=7;
    const winner=ratio>.56?att:(ratio<.44?def:null);
    if(winner){const loser=winner===att?def:att;loser.status='敗走';winner.status='野戦勝利';}
    else {att.status='交戦';def.status='交戦';}
    v9log(`${p?.name||att.province}で${att.name}と${def.name}が交戦。損害 ${aLoss.toLocaleString()} / ${dLoss.toLocaleString()}。${winner?winner.name+'が優勢。':'決着せず。'}`,'battle');
  }

  // ---------- 城郭 ----------
  function getCastle(a,p,castle){
    const key=`${p.id}::${castle}`;
    if(!S.castleState[key]) S.castleState[key]={garrison:p.garrison||Math.round(p.koku*100),food:Math.round(p.koku*500),walls:Math.min(100,45+p.koku*.8),gate:80,inner:100,morale:72,sorties:0};
    return S.castleState[key];
  }
  function siegeTurn(){
    for(const s of [...(S.sieges||[])]){
      const a=S.armies.find(x=>x.id===s.armyId),p=S.provinces.find(x=>x.id===s.province);
      if(!a||!p)continue;
      const c=getCastle(a,p,s.castle);
      const o=officer(a);
      const mode=s.mode||'包囲';
      const pressure=Math.max(1,a.troops*(.004+o.martial/30000)*(a.supply/100));
      c.food=Math.max(0,c.food-Math.round(c.garrison*.018));
      c.morale=Math.max(0,c.morale-(c.food===0?5:1));
      if(mode==='兵糧攻め'){
        s.progress=Math.min(100,(s.progress||0)+Math.max(2,8-c.morale*.04));
      }else if(mode==='強攻'){
        c.walls=Math.max(0,c.walls-pressure*.025);c.gate=Math.max(0,c.gate-pressure*.05);
        c.garrison=Math.max(0,c.garrison-Math.round(pressure*.85));a.troops=Math.max(0,a.troops-Math.round(pressure*.32));
        s.progress=Math.min(100,(s.progress||0)+pressure*.055);
      }else{
        c.walls=Math.max(0,c.walls-pressure*.006);c.garrison=Math.max(0,c.garrison-Math.round(pressure*.24));
        s.progress=Math.min(100,(s.progress||0)+pressure*.025);
      }
      s.garrison=c.garrison;s.food=c.food;s.defense=c.walls;s.morale=c.morale;
      if(c.garrison<=0||c.morale<=10||s.progress>=100){
        const old=p.lord;p.lord=a.lord;p.color=a.lord==='青葉家'?'#7197b7':'#8d6f68';p.relation=a.lord==='青葉家'?'自領':'敵対';
        p.loyalty=48;p.unrest=18;c.garrison=Math.round(c.garrison*.2);S.sieges=S.sieges.filter(x=>x!==s);a.status='占領';a.target='';
        v9log(`${a.name}が${s.castle}を攻略。${p.name}国は${old}から${a.lord}へ。`,'battle');
      }
    }
  }

  // ---------- 補給線 ----------
  function supplyTurn(){
    S.armies.forEach(a=>{
      const home=S.provinces.find(p=>p.id===a.home), here=S.provinces.find(p=>p.id===a.province);
      if(!here)return;
      const distance=Math.max(0,Math.abs((home?.x||0)-here.x)+Math.abs((home?.y||0)-here.y))/100;
      const roadBonus=(window.roadLinks||[]).length?1.05:1;
      a.supply=Math.max(0,Math.min(100,a.supply + (here.lord===a.lord?10:0) - distance*2/roadBonus));
      if(a.supply<20)a.morale=Math.max(0,a.morale-4);
    });
  }

  // ---------- AI ----------
  function neighbors(p){
    const links=window.roadLinks||[];return links.flatMap(([a,b])=>a===p.id?[b]:b===p.id?[a]:[]).map(id=>S.provinces.find(x=>x.id===id)).filter(Boolean);
  }
  function aiAct(lord){
    const cfg=S.ai[lord];if(!cfg||lord==='青葉家')return;
    const own=S.provinces.filter(p=>p.lord===lord), enemy=S.provinces.filter(p=>p.lord!==lord);
    if(!own.length)return;
    const candidates=own.flatMap(p=>neighbors(p).filter(q=>q.lord!==lord).map(q=>({from:p,to:q,score:q.koku+(100-q.loyalty)*.4-(q.garrison||0)/150}))).sort((a,b)=>b.score-a.score);
    const attackChance=(cfg.aggression+(cfg.personality==='好戦型'?20:0)-(cfg.personality==='慎重型'?15:0))/100;
    if(candidates[0]&&Math.random()<attackChance){
      const c=candidates[0];let army=S.armies.find(a=>a.lord===lord&&a.province===c.from.id&&a.troops>1000&&a.status==='待機');
      if(!army){army={id:`ai_${lord}_${S.turn}_${Math.random().toString(36).slice(2,6)}`,lord,name:`${lord}方面軍`,troops:Math.min(7000,Math.max(2500,Math.round(c.from.koku*45))),province:c.from.id,status:'攻撃進軍',target:c.to.name,family:lord,home:c.from.id};initArmy(army);S.armies.push(army);}
      army.status='攻撃進軍';army.target=c.to.name;
      if(window.findRoute){const route=window.findRoute(c.from.id,c.to.id);if(route&&route.length>1)S.movements.push({armyId:army.id,route,index:0,remaining:route.length-1,type:'attack'});}
      cfg.lastAction=`${c.to.name}へ侵攻`;
      v9log(`${lord}（${cfg.personality}）が${c.to.name}への侵攻を開始。`,'ai');
    }else{
      const p=own.sort((a,b)=>a.development-b.development)[0];if(p){p.development=Math.min(100,p.development+2);p.infrastructure=Math.min(100,p.infrastructure+1);p.commerce=Math.min(100,p.commerce+1);cfg.lastAction=`${p.name}を内政強化`;}
    }
  }
  function runAI(){Object.keys(S.ai).filter(k=>k!=='officers').forEach(aiAct);}

  // ---------- 諜報 ----------
  function intelligenceReport(target){
    const enemy=S.armies.filter(a=>a.lord===target&&a.troops>0);
    const power=55+(S.retainers[0]?.[4]||50);
    const precision=Math.min(100,power);
    return enemy.map(a=>{
      const err=Math.round((100-precision)*.35);
      const min=Math.max(0,Math.round(a.troops*(1-err/100))),max=Math.round(a.troops*(1+err/100));
      return {name:a.name,province:a.province,status:a.status,min,max,precision};
    });
  }

  // ---------- 外交 ----------
  function relationScore(a,b){
    const r=S.relations.find(x=>(x[0]===a&&x[1]===b)||(x[0]===b&&x[1]===a));return r?r[3]:0;
  }
  function diplomaticTurn(){
    const lords=[...new Set(S.provinces.map(p=>p.lord))].filter(Boolean);
    for(const a of lords){for(const b of lords){if(a>=b)continue;const score=relationScore(a,b);if(Math.random()<.08){
      const r=S.relations.find(x=>(x[0]===a&&x[1]===b)||(x[0]===b&&x[1]===a));
      if(r){if(score<-40)r[2]='敵対';else if(score>60)r[2]='同盟';else if(score>25)r[2]='友好';else r[2]='中立';}
    }}}
  }

  // ---------- セーブ/ロード ----------
  const SAVE_KEY='sengoku_sim_v9_save';
  function serializableState(){
    const copy={};for(const k in S){if(k==='view')copy[k]=S[k];else copy[k]=S[k];}return copy;
  }
  window.v9Save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(serializableState()));v9log('セーブデータを保存しました。');alert('v9のセーブデータを保存しました。');}catch(e){alert('保存に失敗しました。');}};
  window.v9Load=()=>{try{const raw=localStorage.getItem(SAVE_KEY);if(!raw){alert('セーブデータがありません。');return;}const data=JSON.parse(raw);Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,data);location.reload();}catch(e){alert('ロードに失敗しました。');}};
  window.v9Export=()=>{const blob=new Blob([JSON.stringify(serializableState(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sengoku-v9-${S.turn}.json`;a.click();URL.revokeObjectURL(a.href);};

  // ---------- UI ----------
  function fmt(n){return Math.round(n||0).toLocaleString();}
  function renderV9Panels(){
    const domestic=document.getElementById('domesticContent');
    if(domestic){
      domestic.querySelectorAll('.v9-panel-extra').forEach(e=>e.remove());
      const el=document.createElement('div'); el.className='v9-panel-extra';
      el.innerHTML=`<h3>📈 v9経済・人口</h3><div class="v9-grid"><div class="card"><b>経済循環</b><br>人口 → 石高 → 税収・兵糧 → 動員力</div><div class="card"><b>季節</b><br>${S.date.year}年 ${SEASONS[S.date.season]} / 天候：${S.weather}</div></div><table><tr><th>国</th><th>人口</th><th>開発</th><th>商業</th><th>治安</th></tr>${S.provinces.filter(p=>p.lord==='青葉家').map(p=>`<tr><td>${p.name}</td><td>${fmt(p.population)}</td><td>${Math.round(p.development)}</td><td>${Math.round(p.commerce)}</td><td>${Math.round(100-p.unrest)}</td></tr>`).join('')}</table>`; domestic.appendChild(el);
    }
    const mil=document.getElementById('militaryContent');
    if(mil){
      mil.querySelectorAll('.v9-panel-extra').forEach(e=>e.remove());
      const el=document.createElement('div'); el.className='v9-panel-extra';
      el.innerHTML=`<h3>🚚 v9兵站・戦闘能力</h3><table><tr><th>部隊</th><th>兵力</th><th>士気</th><th>補給</th><th>疲労</th><th>練度</th><th>武将</th></tr>${S.armies.map(a=>`<tr><td>${a.name}</td><td>${fmt(a.troops)}</td><td>${Math.round(a.morale)}</td><td>${Math.round(a.supply)}%</td><td>${Math.round(a.fatigue)}</td><td>${Math.round(a.training)}</td><td>${a.commander}</td></tr>`).join('')}</table>`; mil.appendChild(el);
    }
    const dip=document.getElementById('diplomacyContent');
    if(dip){
      dip.querySelectorAll('.v9-panel-extra').forEach(e=>e.remove());
      const el=document.createElement('div'); el.className='v9-panel-extra';
      el.innerHTML=`<h3>🧠 v9 AI大名</h3><table><tr><th>勢力</th><th>性格</th><th>攻撃性</th><th>リスク</th><th>直近の判断</th></tr>${Object.keys(S.ai).filter(k=>k!=='officers').map(l=>{const c=S.ai[l];return `<tr><td>${l}</td><td>${c.personality}</td><td>${c.aggression}</td><td>${c.risk}</td><td>${c.lastAction}</td></tr>`}).join('')}</table>`; dip.appendChild(el);
    }
    const ret=document.getElementById('retainerContent');
    if(ret){
      ret.querySelectorAll('.v9-panel-extra').forEach(e=>e.remove());
      const el=document.createElement('div'); el.className='v9-panel-extra';
      el.innerHTML=`<h3>🧑‍✈️ v9武将状態</h3><div class="card">武将能力は戦闘・内政・外交・諜報の各判定に接続されています。</div>`; ret.appendChild(el);
    }
    const intel=document.getElementById('intelContent');
    if(intel){
      intel.querySelectorAll('.v9-panel-extra').forEach(e=>e.remove());
      const el=document.createElement('div'); el.className='v9-panel-extra';
      const lords=[...new Set(S.armies.map(a=>a.lord))].filter(x=>x!=='青葉家');
      el.innerHTML=`<h3>🕵️ v9諜報</h3><div class="card">敵軍情報は推定幅を持ち、諜報能力によって精度が変化します。</div>${lords.map(l=>`<h4>${l}</h4><table><tr><th>部隊</th><th>現在地</th><th>推定兵力</th><th>精度</th></tr>${intelligenceReport(l).map(x=>`<tr><td>${x.name}</td><td>${x.province}</td><td>${fmt(x.min)}～${fmt(x.max)}</td><td>${x.precision}%</td></tr>`).join('')}</table>`).join('')}`; intel.appendChild(el);
    }
  }
  function addV9Controls(){
    const side=document.querySelector('.side'); if(!side||document.getElementById('v9Save'))return;
    const hr=document.createElement('hr');side.appendChild(hr);
    [['v9Save','💾 セーブ'],['v9Load','📂 ロード'],['v9Export','📤 JSON出力']].forEach(([id,text])=>{const b=document.createElement('button');b.id=id;b.textContent=text;b.onclick=window[id];side.appendChild(b);});
    const badge=document.createElement('div');badge.className='v9badge';badge.textContent='v9 本格試作';side.appendChild(badge);
  }

  // ---------- ターン統合 ----------
  const next=document.getElementById('nextTurn');
  if(next){
    const baseNext=next.onclick;
    next.onclick=()=>{
      advanceCalendar();
      S.weather=['晴','晴','曇','雨','雪'][Math.floor(Math.random()*5)];
      updateEconomy(); maintainArmies(); supplyTurn(); runAI(); diplomaticTurn(); siegeTurn();
      if(typeof baseNext==='function') baseNext();
      S.troops=S.armies.filter(a=>a.lord==='青葉家').reduce((n,a)=>n+a.troops,0);
      document.getElementById('gold').textContent=fmt(S.gold);
      document.getElementById('food').textContent=fmt(S.food);
      document.getElementById('population').textContent=fmt(S.population);
      document.getElementById('troops').textContent=fmt(S.troops);
      document.getElementById('turn').textContent=`第${S.turn}ターン`;
      renderV9Panels();
      v9log('v9拡張処理：経済・AI・補給・外交・城郭を更新。');
    };
  }

  // 修正：既存ターン処理との二重加算を避けるため、上の統合処理ではv7の旧クリックを呼ばない。
  window.v9Battle=detailedBattle;
  window.v9SiegeTurn=siegeTurn;
  window.v9Intelligence=intelligenceReport;
  window.v9AI=runAI;
  window.v9Render=renderV9Panels;
  addV9Controls();
  renderV9Panels();
})();

</script>
</body>
